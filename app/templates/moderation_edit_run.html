{% extends "base.html" %}
{% block title %}Edit run #{{ run.id }} &bullet; {{ app_name }}{% endblock %}
{% block content %}
	<div class="title-row">
		<h1>Edit run #{{ run.id }}</h1>
		<a href="/runs/{{ run.id }}">Cancel</a>
	</div>

	{% if errors %}
		<div class="notice error">
			<ul>{% for error in errors %}<li>{{ error }}</li>{% endfor %}</ul>
		</div>
	{% endif %}

	<form class="form-panel" method="post" action="/moderation/runs/{{ run.id }}/edit">
		<input type="hidden" name="csrf_token" value="{{ csrf_token }}">
		<label>
			Discord user ID
			<input name="discord_id" value="{{ values.discord_id }}" inputmode="numeric" maxlength="25" autocomplete="off" required>
		</label>
		<label>
			Temporary display name
			<input name="temporary_display_name" value="{{ values.temporary_display_name }}" maxlength="80" autocomplete="off" required>
			<span class="field-help">Used only if this Discord account has never signed in.</span>
		</label>
		<label>
			Category
			<select name="category_id" required>
				{% for category in categories %}
					{% if loop.first or category.build_slug != categories[loop.index0 - 1].build_slug %}
						{% if not loop.first %}</optgroup>{% endif %}
						<optgroup label="{{ category.build_name }}">
					{% endif %}
					<option value="{{ category.id }}" {% if values.category_id == category.id %}selected{% endif %}>{{ category.name }}</option>
					{% if loop.last %}</optgroup>{% endif %}
				{% endfor %}
			</select>
		</label>
		<label>
			Time
			<input name="run_time" value="{{ values.run_time }}" placeholder="1:02:34.567" autocomplete="off" required>
		</label>
		<label>
			Video URL
			<input type="url" name="video_url" value="{{ values.video_url }}" placeholder="https://youtu.be/..." maxlength="500" required>
		</label>
		<label>
			Splits URL <span class="muted">(optional)</span>
			<input type="url" name="splits_url" value="{{ values.splits_url }}" placeholder="https://therun.gg/..." maxlength="500">
		</label>
		<label>
			Notes <span class="muted">(optional)</span>
			<textarea name="notes" rows="4" maxlength="2000">{{ values.notes }}</textarea>
		</label>
		<button type="submit">Save changes</button>
	</form>
{% endblock %}

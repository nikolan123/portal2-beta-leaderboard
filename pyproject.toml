[project]
name = "portal2-beta-leaderboard"
version = "0.1.2"
description = "Portal 2 Beta Speedrun Leaderboard"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.128,<1",
    "uvicorn[standard]>=0.30,<1",
    "sqlalchemy>=2.0,<3",
    "jinja2>=3.1,<4",
    "httpx>=0.28,<1",
    "python-multipart>=0.0.20,<1",
    "itsdangerous>=2.2,<3",
    "python-dotenv>=1.0,<2",
    "markdown>=3.8,<4",
    "mistune>=3,<4",
    "nh3>=0.3,<1",
    "alembic>=1.16,<2",
]

[dependency-groups]
dev = [
    "pytest>=9,<10",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
